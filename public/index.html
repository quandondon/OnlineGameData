<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="glass-card" style="width: 350px;">
            <h2 id="form-title">Login</h2>
            <div id="register-fields" style="display:none;">
                <input type="text" id="reg-username" placeholder="Username">
            </div>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" style="width:100%" onclick="handleAuth()" id="auth-btn">Sign In</button>
            <p onclick="toggleAuth()" style="text-align:center; cursor:pointer; font-size: 13px; margin-top:15px;">Switch to Register</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
